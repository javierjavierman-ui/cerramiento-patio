<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFQ - Cerramiento de Patio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --bg-color: #f8f9fa; --text-color: #333; --card-bg: #ffffff; --border-color: #e2e8f0; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 40px auto; background: var(--card-bg); padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        header { text-align: center; border-bottom: 3px solid var(--secondary); padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: var(--primary); font-size: 2.2em; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; font-size: 1.2em; margin-top: 0; }
        h2 { color: var(--primary); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 40px; }
        
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .photo-item { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color); }
        
        .markdown-body { background-color: #f1f8ff; padding: 25px; border-radius: 8px; border-left: 5px solid var(--secondary); margin-bottom: 30px; }
        .markdown-body h1, .markdown-body h2 { color: var(--primary); border: none; margin-top: 15px; padding-bottom: 0; }
        .markdown-body ul { padding-left: 20px; }
        
        /* Solución Cross-Browser para Safari/Chrome */
        .markdown-body pre { background-color: #2d3436; color: #f5f6fa; padding: 15px; border-radius: 8px; overflow-x: auto; font-family: 'Courier New', Courier, monospace; line-height: 1.3; font-size: 0.9em; border: none; margin: 20px 0; }
        .markdown-body code { font-family: inherit; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Proyecto de Cerramiento Autoportante</h1>
        <p class="subtitle">Extensión habitable anexa a la cocina.</p>
    </header>

    <section>
        <h2>Especificaciones Técnicas (RFQ)</h2>
        <div id="md-content" class="markdown-body">
            <p style="color: #7f8c8d; font-style: italic;">Cargando documento...</p>
        </div>
    </section>

    <section>
        <h2>Galería del Proyecto</h2>
        <div class="photo-grid" id="public-gallery">
            <!-- Fotos cargadas dinámicamente -->
        </div>
    </section>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const savedMd = localStorage.getItem('rfqMdSummary');
        if (savedMd) {
            const converter = new showdown.Converter();
            document.getElementById('md-content').innerHTML = converter.makeHtml(savedMd);
        }

        const publicGallery = document.getElementById('public-gallery');
        const appData = JSON.parse(localStorage.getItem('rfqPrivateData')) || { photos: [] };
        
        if(appData.photos.length > 0) {
            appData.photos.forEach(url => {
                publicGallery.innerHTML += `<img src="${url}" class="photo-item">`;
            });
        } else {
            publicGallery.innerHTML = "<p>No hay imágenes disponibles.</p>";
        }
    });
</script>

</body>
</html>
