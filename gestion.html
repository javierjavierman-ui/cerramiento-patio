<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Interna - RFQ Cerramiento</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --bg-color: #f8f9fa; --text-color: #333; --card-bg: #ffffff; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 40px auto; background: var(--card-bg); padding: 40px; border-radius: 10px; border-top: 5px solid #e74c3c; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: var(--primary); }
        
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .photo-wrapper { position: relative; width: 100%; height: 200px; }
        .photo-item { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid #ccc; }
        .delete-btn { position: absolute; top: 5px; right: 5px; background: #e74c3c; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .delete-btn:hover { background: #c0392b; }

        .btn-submit { background-color: var(--secondary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        textarea.markdown-editor { width: 100%; font-family: 'Courier New', monospace; font-size: 0.9em; padding: 10px; box-sizing: border-box; background-color: #fcfcfc; border: 1px solid #ccc; border-radius: 5px; }
        .upload-section { background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid var(--secondary); }
    </style>
</head>
<body>

<div class="container">
    <h1>Panel de Gestión Privado</h1>
    
    <section style="background-color: #fef9e7; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
        <h2>🛠️ Editar RFQ (Pública)</h2>
        <label>Pega aquí el documento en formato .md:</label>
        <textarea id="adminMdSummary" class="markdown-editor" rows="12"></textarea>
        <button class="btn-submit" onclick="saveMdSummary()">Actualizar RFQ en la Web</button>
    </section>

    <section>
        <h2>Galería de Imágenes</h2>
        <div class="upload-section">
            <label style="font-weight: bold; display: block; margin-bottom: 10px;">Añadir nueva imagen:</label>
            <input type="file" id="photoUpload" accept="image/*" onchange="handlePhotoUpload(event)">
            <small style="display:block; color:#7f8c8d; margin-top:5px;">(Las imágenes se guardan en la memoria de tu navegador).</small>
        </div>
        <div class="photo-grid" id="photo-gallery"></div>
    </section>
</div>

<script>
    const defaultPhotos = ['lado%20sur.JPG', 'lado%20este.JPG', 'lado%20norte.JPG', 'lado%20oeste.JPG'];
    let appData = JSON.parse(localStorage.getItem('rfqPrivateData')) || { photos: defaultPhotos };

    function renderApp() {
        const photoGrid = document.getElementById('photo-gallery');
        photoGrid.innerHTML = '';
        appData.photos.forEach((url, index) => {
            photoGrid.innerHTML += `
                <div class="photo-wrapper">
                    <img src="${url}" class="photo-item">
                    <button class="delete-btn" onclick="deletePhoto(${index})" title="Eliminar imagen">&times;</button>
                </div>`;
        });

        const savedMd = localStorage.getItem('rfqMdSummary');
        if (savedMd) document.getElementById('adminMdSummary').value = savedMd;
    }

    function saveMdSummary() {
        localStorage.setItem('rfqMdSummary', document.getElementById('adminMdSummary').value);
        alert("¡RFQ actualizada con éxito!");
    }

    function handlePhotoUpload(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                appData.photos.push(e.target.result);
                localStorage.setItem('rfqPrivateData', JSON.stringify(appData));
                renderApp();
            } catch (err) {
                alert("La imagen es demasiado grande o la memoria del navegador está llena. Elimina fotos antiguas e intenta con un archivo más comprimido.");
            }
        };
        reader.readAsDataURL(file);
    }

    function deletePhoto(index) {
        if(confirm("¿Seguro que quieres eliminar esta imagen?")) {
            appData.photos.splice(index, 1);
            localStorage.setItem('rfqPrivateData', JSON.stringify(appData));
            renderApp();
        }
    }

    document.addEventListener("DOMContentLoaded", renderApp);
</script>
</body>
</html>
